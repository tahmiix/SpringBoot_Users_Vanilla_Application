<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Users</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h2>Register User</h2>
<div class="form-div">
    <form id="userForm" >

        <label for="name">Name</label>
        <input type = "text" id="name"></br></br>

        <label for="email">Email</label>
        <input type = "email" id="email"></br></br>

        <button type="submit">Save</button>

    </form>
</div>
<div class="container" style="max-width: 700px;">
    <h3 class="mb-3">Users</h3>

    <table class="table">
        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>Email</th>
            <th>Actions</th>
        </tr>
        <tbody id="usersTable">

        </tbody>
    </table>
</div>

    <script>

        async function loadUsers() {
            const response = await fetch('/api/user');
            const data = await response.json();
            console.log(data);

            const tableData = document.getElementById('usersTable');

            tableData.innerHTML = data.map(function(u) {
                return `
                    <tr>
                        <td>${u.id}</td>
                        <td>${u.name}</td>
                        <td>${u.email}</td>
                        <td>
                           <div class="actionButtons">
                                <button type="button" class="btn-delete" onclick="deleteUser(${u.id})">Delete</button>
                                <button type="button" class="btn-update" onclick="updateUser(${u.id})">Update</button>
                            </div>
                         </td>
                    </tr>
                `;
            }).join('');
        }

        loadUsers();

        //create user script

        const userForm = document.getElementById('userForm')
        userForm.addEventListener('submit', async function(event){

            event.preventDefault();

            const name = document.getElementById('name').value
            const email = document.getElementById('email').value

            const personData = {
                name: name,
                email: email,
            }

            try{
                const response = await fetch('/api/user',{
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(personData)
                });

                if(response.ok){
                    const savedPerson = await response.json();
                    console.log(savedPerson);
                    alert("Saved Successfully" + savedPerson.name);
                    userForm.reset();
                }else {
                    alert("Something went wrong" + response.status);
                }
            }catch(err){
                console.error(err);
                alert("Something went wrong");
            }
        });

        // delete user script
        async function deleteUser(id) {
            if (!confirm('Are you sure you want to delete this user?')) {
                return;
            }

            try {
                const response = await fetch('/api/user/' + id, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    alert('User deleted successfully');
                    loadUsers();
                } else {
                    alert('Failed to delete user: ' + response.status);
                }
            } catch (err) {
                console.error(err);
                alert('Something went wrong');
            }
        }


    </script>
</body>

</html>
